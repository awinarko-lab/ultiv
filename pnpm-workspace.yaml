packages:
  - "apps/*"
  - "packages/*"

# Vetted 2026-10-24: @google/genai preinstall is a literal no-op echo; protobufjs
# postinstall is non-essential. Never flip one of these to true without reading
# the script first.
allowBuilds:
  "@google/genai": false
  protobufjs: false
  "@mongodb-js/zstd": false
  node-liblzma: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
